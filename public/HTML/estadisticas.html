<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/default.css">
    <link rel="stylesheet" href="/CSS/estadisticas.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>FifaScan - Estadísticas</title>
</head>
<body>

    <header class="header-stats">
        <a href="../index.html" class="boton-volver"><i class="fas fa-chevron-left"></i></a>
        <h1>ESTADISTICAS</h1>
    </header>

    <section class="fondo-estadisticas">
        <div class="tarjeta-informe">
            
            <div class="navegacion-pais">
                <button class="btn-nav" id="btn-ant"><i class="fas fa-chevron-left"></i></button>
                <h2 class="titulo-pais" id="titulo-pais">MÉXICO</h2>
                <button class="btn-nav" id="btn-sig"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <div class="contenedor-interno">
                <h3 class="subtitulo">INFORME DE SELECCIÓN<br>(PROCESO 2026)</h3>

                <div class="contenedor-grafico">
                    <div class="grafico-pastel" id="grafico"></div>
                </div>

                <div class="leyenda-datos">
                    <div class="columna-leyenda">
                        <div class="item-leyenda">
                            <div class="punto-color" id="color-victorias"></div>
                            <span id="lbl-victorias">Victorias</span>
                        </div>
                        <div class="item-leyenda">
                            <div class="punto-color" id="color-empates"></div>
                            <span id="lbl-empates">Empates</span>
                        </div>
                        <div class="item-leyenda">
                            <div class="punto-color" id="color-derrotas"></div>
                            <span id="lbl-derrotas">Derrotas</span>
                        </div>
                    </div>
                    <div class="columna-leyenda">
                        <div class="item-leyenda">
                            <div class="punto-color" id="color-favor"></div>
                            <span id="lbl-favor">Goles Favor</span>
                        </div>
                        <div class="item-leyenda">
                            <div class="punto-color" id="color-contra"></div>
                            <span id="lbl-contra">Goles Contra</span>
                        </div>
                    </div>
                </div>

                <h3 class="titulo-seccion">PLANTILLA</h3>
                <div class="lista-jugadores" id="lista-jugadores"></div>

                <h3 class="titulo-seccion">VIDEOS DESTACADOS</h3>
                
                <div class="mini-galeria">
                    <div class="mini-card">
                        <div class="thumbnail-container">
                            <video class="video-preview" poster="/MULTIMEDIA/españa.jpg">
                                <source src="/MULTIMEDIA/ESPAMA.mp4" type="video/mp4">
                            </video>
                            <div class="custom-controls">
                                <button class="play-btn"><i class="fas fa-play"></i></button>
                                <div class="right-controls">
                                    <button class="fullscreen-btn"><i class="fas fa-expand"></i></button>
                                    <div class="video-settings">
                                        <button class="settings-btn"><i class="fas fa-cog"></i></button>
                                        <div class="filters-menu">
                                            <p>FILTROS</p>
                                            <button data-filter="none">Normal</button>
                                            <button data-filter="blur">Desenfoque</button>
                                            <button data-filter="pixel">Pixelado</button>
                                            <button data-filter="thermal">Térmica</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <p>GOLES</p>
                    </div>

                    <div class="mini-card">
                        <div class="thumbnail-container">
                            <video class="video-preview" poster="/MULTIMEDIA/MEXVSAL.jpg">
                                <source src="/MULTIMEDIA/ALEMANIAVSMEX.mp4" type="video/mp4">
                            </video>
                            <div class="custom-controls">
                                <button class="play-btn"><i class="fas fa-play"></i></button>
                                <div class="right-controls">
                                    <button class="fullscreen-btn"><i class="fas fa-expand"></i></button>
                                    <div class="video-settings">
                                        <button class="settings-btn"><i class="fas fa-cog"></i></button>
                                        <div class="filters-menu">
                                            <p>FILTROS</p>
                                            <button data-filter="none">Normal</button>
                                            <button data-filter="blur">Desenfoque</button>
                                            <button data-filter="pixel">Pixelado</button>
                                            <button data-filter="thermal">Térmica</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <p>JUGADAS CLAVE</p>
                    </div>

                    <div class="mini-card">
                        <div class="thumbnail-container">
                            <video class="video-preview" poster="/MULTIMEDIA/GOLESME.jpg">
                                <source src="/MULTIMEDIA/GolesMexico.mp4" type="video/mp4">
                            </video>
                            <div class="custom-controls">
                                <button class="play-btn"><i class="fas fa-play"></i></button>
                                <div class="right-controls">
                                    <button class="fullscreen-btn"><i class="fas fa-expand"></i></button>
                                    <div class="video-settings">
                                        <button class="settings-btn"><i class="fas fa-cog"></i></button>
                                        <div class="filters-menu">
                                            <p>FILTROS</p>
                                            <button data-filter="none">Normal</button>
                                            <button data-filter="blur">Desenfoque</button>
                                            <button data-filter="pixel">Pixelado</button>
                                            <button data-filter="thermal">Térmica</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <p>ENTREVISTAS</p>
                    </div>

                    <div class="mini-card">
                        <div class="thumbnail-container">
                            <video class="video-preview" poster="/MULTIMEDIA/GOLCOREA.jpg">
                                <source src="/MULTIMEDIA/GOLCOREA.mp4" type="video/mp4">
                            </video>
                            <div class="custom-controls">
                                <button class="play-btn"><i class="fas fa-play"></i></button>
                                <div class="right-controls">
                                    <button class="fullscreen-btn"><i class="fas fa-expand"></i></button>
                                    <div class="video-settings">
                                        <button class="settings-btn"><i class="fas fa-cog"></i></button>
                                        <div class="filters-menu">
                                            <p>FILTROS</p>
                                            <button data-filter="none">Normal</button>
                                            <button data-filter="blur">Desenfoque</button>
                                            <button data-filter="pixel">Pixelado</button>
                                            <button data-filter="thermal">Térmica</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <p>RESUMEN</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="/JS/estadisticas.js"></script>
    
    <script>
        document.querySelectorAll('.thumbnail-container').forEach(container => {
            const video = container.querySelector('video');
            const playBtn = container.querySelector('.play-btn');
            const fsBtn = container.querySelector('.fullscreen-btn');
            const settingsBtn = container.querySelector('.settings-btn');
            const filtersMenu = container.querySelector('.filters-menu');

            const togglePlay = (e) => {
                e.stopPropagation();
                if (video.paused) { video.play(); playBtn.innerHTML = '<i class="fas fa-pause"></i>'; }
                else { video.pause(); playBtn.innerHTML = '<i class="fas fa-play"></i>'; }
            };

            playBtn.addEventListener('click', togglePlay);
            video.addEventListener('click', togglePlay);

            fsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!document.fullscreenElement) { container.requestFullscreen(); fsBtn.innerHTML = '<i class="fas fa-compress"></i>'; }
                else { document.exitFullscreen(); fsBtn.innerHTML = '<i class="fas fa-expand"></i>'; }
            });

            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                filtersMenu.classList.toggle('active');
            });

            container.querySelectorAll('.filters-menu button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const filter = btn.dataset.filter;
                    video.classList.remove("filter-blur", "filter-pixel", "filter-thermal");
                    if (filter !== "none") video.classList.add("filter-" + filter);
                    filtersMenu.classList.remove("active");
                });
            });
        });

        document.addEventListener("click", () => {
            document.querySelectorAll(".filters-menu").forEach(m => m.classList.remove("active"));
        });
    </script>
</body>
</html>
