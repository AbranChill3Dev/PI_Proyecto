<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="/CSS/default.css">
    <link rel="stylesheet" href="/CSS/camara.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>FifaScan</title>
    <style>
        /* Estilo para el botón deshabilitado */
        .boton-deshabilitado {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
            filter: grayscale(1);
        }
    </style>
</head>

<body>
    <a-scene mindar-image="imageTargetSrc: /Modelos/targets(2).mind; uiScanning: #none;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="sudafrica" src="/Modelos/Sudafrica.glb"></a-asset-item>
            <a-asset-item id="tunez" src="/Modelos/Tunez.glb"></a-asset-item>
            <a-asset-item id="japon" src="/Modelos/Japon.glb"></a-asset-item>
            <a-asset-item id="uruguay" src="/Modelos/Uruguay.glb"></a-asset-item>
            <a-asset-item id="espana" src="/Modelos/Espana.glb"></a-asset-item>
            <a-asset-item id="corea" src="/Modelos/Corea.glb"></a-asset-item>
            <a-asset-item id="mexico" src="/Modelos/Mexico.glb"></a-asset-item>
            <a-asset-item id="colombia" src="/Modelos/Colombia.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" data-country="sudafrica">
            <a-gltf-model src="#sudafrica" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true"></a-gltf-model>
        </a-entity>
        </a-scene>

    <div class="controles-camara">
        <a href="../index.html" class="boton-flotante">
            <i class="fas fa-arrow-left"></i><span>VOLVER</span>
        </a>
        <a id="btn-estadisticas" href="#" class="boton-flotante boton-oculto">
            <i class="fas fa-chart-bar"></i><span>ESTADISTICAS</span>
        </a>
        <button id="btn-animaciones" class="boton-flotante boton-oculto">
            <i class="fas fa-wand-magic-sparkles"></i><span>ANIMACIONES</span>
        </button>
    </div>

    <canvas id="fireworks-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 9999;"></canvas>

    <script>
        const paisMap = { 'mexico': 0, 'espana': 1, 'uruguay': 2, 'colombia': 3, 'japon': 4, 'corea': 5, 'sudafrica': 6, 'tunez': 7 };
        const btnEstadisticas = document.getElementById('btn-estadisticas');
        const btnAnimaciones = document.getElementById('btn-animaciones');
        const fireworksCanvas = document.getElementById('fireworks-canvas');
        const ctx = fireworksCanvas.getContext('2d');
        
        let particles = [];
        let currentAnim = 0;
        let showText = false;
        let textOpacity = 0;
        let isAnimating = false;
        let canClick = true; // Control del delay de 2 seg

        function resizeCanvas() {
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Lógica de detección de Targets
        const targets = document.querySelectorAll('[mindar-image-target]');
        targets.forEach(target => {
            target.addEventListener('targetFound', () => {
                const country = target.getAttribute('data-country');
                btnEstadisticas.href = `estadisticas.html?pais=${paisMap[country]}`;
                btnEstadisticas.classList.remove('boton-oculto');
                btnAnimaciones.classList.remove('boton-oculto');
            });
            target.addEventListener('targetLost', () => {
                btnEstadisticas.classList.add('boton-oculto');
                btnAnimaciones.classList.add('boton-oculto');
            });
        });

        // Clase Partícula para Fuegos Artificiales
        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 2;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 6 + 2;
                this.speedX = Math.cos(angle) * velocity;
                this.speedY = Math.sin(angle) * velocity;
                this.opacity = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.05; // Gravedad suave
                this.opacity -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF', '#FFFFFF'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 50; i++) {
                particles.push(new FireworkParticle(x, y, color));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].opacity <= 0) particles.splice(i, 1);
            }

            if (showText) {
                ctx.save();
                ctx.globalAlpha = textOpacity;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 80px "Zen Dots"';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = "orange";
                ctx.fillText('GOOOL', fireworksCanvas.width / 2, fireworksCanvas.height / 2);
                ctx.restore();
                textOpacity -= 0.01;
                if (textOpacity <= 0) showText = false;
            }

            if (particles.length > 0 || showText) {
                requestAnimationFrame(animate);
            } else {
                fireworksCanvas.style.display = 'none';
                isAnimating = false;
            }
        }

        btnAnimaciones.addEventListener('click', (e) => {
            if (!canClick) return; // Si está en delay, no hacer nada

            canClick = false;
            btnAnimaciones.classList.add('boton-deshabilitado');

            fireworksCanvas.style.display = 'block';
            
            if (currentAnim === 0) {
                // ANIMACIÓN GOL
                showText = true;
                textOpacity = 1;
                createExplosion(window.innerWidth / 2, window.innerHeight / 2);
            } else {
                // ANIMACIÓN FUEGOS ARTIFICIALES POR TODA LA PANTALLA
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        const randomX = Math.random() * window.innerWidth;
                        const randomY = Math.random() * (window.innerHeight * 0.7);
                        createExplosion(randomX, randomY);
                    }, i * 150);
                }
            }

            if (!isAnimating) {
                isAnimating = true;
                animate();
            }

            currentAnim = (currentAnim + 1) % 2;

            // Timer de 2 segundos para reactivar el botón
            setTimeout(() => {
                canClick = true;
                btnAnimaciones.classList.remove('boton-deshabilitado');
            }, 2000);
        });
    </script>
</body>
</html>
