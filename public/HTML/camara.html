<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="../CSS/camara.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>FifaScan</title>
    <style>
        .boton-deshabilitado {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
            filter: grayscale(1);
        }
        
        /* Estilo opcional para resaltar el botón cuando el movimiento está activado */
        .boton-activo {
            background-color: rgba(60, 179, 113, 0.8) !important; /* Verde suave */
            border-color: #fff !important;
        }
    </style>
</head>

<body class="fondo-marco">

    <div class="main-container">

        <div class="ar-window">
            <a-scene class="pantalla-AR" 
                mindar-image="imageTargetSrc: /Modelos/targets(2).mind; uiScanning: #none; autoStart: true; filterMinCF:0.001; filterBeta: 0.01;" 
                embedded
                color-space="sRGB" 
                renderer="colorManagement: true, physicallyCorrectLights, alpha: true" 
                vr-mode-ui="enabled: false"
                device-orientation-permission-ui="enabled: false">

                <a-assets>
                    <a-asset-item id="sudafrica" src="/Modelos/Sudafrica.glb"></a-asset-item>
                    <a-asset-item id="tunez" src="/Modelos/Tunez.glb"></a-asset-item>
                    <a-asset-item id="japon" src="/Modelos/Japon.glb"></a-asset-item>
                    <a-asset-item id="uruguay" src="/Modelos/Uruguay.glb"></a-asset-item>
                    <a-asset-item id="espana" src="/Modelos/Espana.glb"></a-asset-item>
                    <a-asset-item id="corea" src="/Modelos/Corea.glb"></a-asset-item>
                    <a-asset-item id="mexico" src="/Modelos/Mexico.glb"></a-asset-item>
                    <a-asset-item id="colombia" src="/Modelos/Colombia.glb"></a-asset-item>
                </a-assets>

                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                <a-entity mindar-image-target="targetIndex: 0" data-country="sudafrica">
                    <a-gltf-model src="#sudafrica" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                        animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true; enabled: false"></a-gltf-model>
                </a-entity>

                <a-entity mindar-image-target="targetIndex: 1" data-country="tunez">
                    <a-gltf-model src="#tunez" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                        animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true; enabled: false"></a-gltf-model>
                </a-entity>

                <a-entity mindar-image-target="targetIndex: 2" data-country="japon">
                    <a-gltf-model src="#japon" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                        animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true; enabled: false"></a-gltf-model>
                </a-entity>

                <a-entity mindar-image-target="targetIndex: 3" data-country="uruguay">
                    <a-gltf-model src="#uruguay" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                        animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true; enabled: false"></a-gltf-model>
                </a-entity>

                <a-entity mindar-image-target="targetIndex: 4" data-country="espana">
                    <a-gltf-model src="#espana" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                        animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true; enabled: false"></a-gltf-model>
                </a-entity>

                <a-entity mindar-image-target="targetIndex: 5" data-country="corea">
                    <a-gltf-model src="#corea" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                        animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true; enabled: false"></a-gltf-model>
                </a-entity>

                <a-entity mindar-image-target="targetIndex: 6" data-country="mexico">
                    <a-gltf-model src="#mexico" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                        animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true; enabled: false"></a-gltf-model>
                </a-entity>

                <a-entity mindar-image-target="targetIndex: 7" data-country="colombia">
                    <a-gltf-model src="#colombia" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                        animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true; enabled: false"></a-gltf-model>
                </a-entity>
            </a-scene>
        </div>

            <div class="controles-camara-centered">
            <a href="/index.html" class="boton-flotante">
                <i class="fas fa-arrow-left"></i><span></span>
            </a>
            
            <a id="btn-info" href="#" class="boton-flotante boton-oculto">
                <i class="fas fa-info-circle"></i><span></span>
            </a>
            
            <button id="btn-movimiento" class="boton-flotante boton-oculto">
                <i class="fas fa-sync"></i><span></span>
            </button>

            <button id="btn-animaciones" class="boton-flotante boton-oculto">
                <i class="fas fa-wand-magic-sparkles"></i><span></span>
            </button>
        </div>

    </div>

    <canvas id="fireworks-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 10000;"></canvas>

    <script>
        const paisMap = { 'mexico': 0, 'espana': 1, 'uruguay': 2, 'colombia': 3, 'japon': 4, 'corea': 5, 'sudafrica': 6, 'tunez': 7 };
        const btnInfo = document.getElementById('btn-info'); 
        const btnAnimaciones = document.getElementById('btn-animaciones');
        const btnMovimiento = document.getElementById('btn-movimiento'); // Referencia al nuevo botón
        const fireworksCanvas = document.getElementById('fireworks-canvas');
        const ctx = fireworksCanvas.getContext('2d');
        
        let particles = [];
        let currentAnim = 0;
        let showText = false;
        let textOpacity = 0;
        let isAnimating = false;
        let canClick = true;
        let estaGirando = false; // Estado global de la rotación

        function resizeCanvas() {
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- CORRECCIÓN CRÍTICA PARA CAPAS Y VISIBILIDAD DE MODELOS ---
        document.querySelector('a-scene').addEventListener('renderstart', () => {
            const sceneEl = document.querySelector('a-scene');
            setTimeout(() => {
                // Forzamos el redimensionado del motor de MindAR
                if (sceneEl.components['mindar-image']) {
                    sceneEl.components['mindar-image'].resize();
                }
                // Buscamos el video inyectado y lo traemos al frente del contenedor
                const videoEl = document.querySelector('video');
                if (videoEl) {
                    videoEl.style.zIndex = "1";
                }
            }, 500);
        });

        const targets = document.querySelectorAll('[mindar-image-target]');
        targets.forEach(target => {
            target.addEventListener('targetFound', () => {
                const country = target.getAttribute('data-country');
              
                btnInfo.href = `info.html?pais=${paisMap[country]}`; 
                
                btnInfo.classList.remove('boton-oculto');
                btnAnimaciones.classList.remove('boton-oculto');
                btnMovimiento.classList.remove('boton-oculto'); // Mostrar botón movimiento
            });
            target.addEventListener('targetLost', () => {
                btnInfo.classList.add('boton-oculto');
                btnAnimaciones.classList.add('boton-oculto');
                btnMovimiento.classList.add('boton-oculto'); // Ocultar botón movimiento
                
                // Opcional: Detener el giro si se pierde el target
                detenerRotacion();
            });
        });

        // --- LÓGICA DEL BOTÓN DE MOVIMIENTO ---
        
        function detenerRotacion() {
            estaGirando = false;
            const modelos = document.querySelectorAll('a-gltf-model');
            modelos.forEach(modelo => {
                // Desactivamos la animación componente por componente
                modelo.setAttribute('animation', 'enabled', false);
            });
            btnMovimiento.classList.remove('boton-activo');
            // Opcional: volver a poner el texto original si lo cambiaste
            // btnMovimiento.querySelector('span').innerText = "MOVIMIENTO";
        }

        btnMovimiento.addEventListener('click', () => {
            // Alternar estado
            estaGirando = !estaGirando;
            
            // Buscar todos los modelos en la escena
            const modelos = document.querySelectorAll('a-gltf-model');
            
            modelos.forEach(modelo => {
                // Modificar la propiedad 'enabled' dentro del atributo 'animation'
                modelo.setAttribute('animation', 'enabled', estaGirando);
            });

            // Feedback visual en el botón
            if (estaGirando) {
                btnMovimiento.classList.add('boton-activo');
                // Opcional: cambiar el texto
                // btnMovimiento.querySelector('span').innerText = "PARAR";
            } else {
                btnMovimiento.classList.remove('boton-activo');
                // Opcional: volver a poner el texto original
                // btnMovimiento.querySelector('span').innerText = "MOVIMIENTO";
            }
        });


        // --- Lógica de partículas (sin cambios) ---
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.size = Math.random() * 4 + 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.velocityX = Math.cos(angle) * speed;
                this.velocityY = Math.sin(angle) * speed;
                this.opacity = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            update() { this.x += this.velocityX; this.y += this.velocityY; this.velocityY += 0.1; this.opacity -= this.decay; }
            draw() { ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }

        function createExplosion(x, y, colorSet = null) {
            const colors = colorSet || ['#FFD700', '#FF4500', '#FFFFFF', '#FF0000'];
            for (let i = 0; i < 60; i++) { particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)])); }
        }

        function animateLoop() {
            ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); particles[i].draw(); if (particles[i].opacity <= 0) particles.splice(i, 1); }
            if (showText) {
                ctx.save(); ctx.globalAlpha = textOpacity; ctx.fillStyle = 'yellow'; ctx.font = 'bold 80px "Zen Dots"'; ctx.textAlign = 'center';
                ctx.fillText('GOOOL', fireworksCanvas.width / 2, fireworksCanvas.height / 2); ctx.restore(); textOpacity -= 0.01; if (textOpacity <= 0) showText = false;
            }
            if (particles.length > 0 || showText) requestAnimationFrame(animateLoop);
            else { fireworksCanvas.style.display = 'none'; isAnimating = false; }
        }

        btnAnimaciones.addEventListener('click', (e) => {
            if (!canClick) return; canClick = false;
            btnAnimaciones.classList.add('boton-deshabilitado');
            fireworksCanvas.style.display = 'block';
            if (currentAnim === 0) { showText = true; textOpacity = 1; createExplosion(window.innerWidth / 2, window.innerHeight / 2); }
            if (!isAnimating) { isAnimating = true; animateLoop(); }
            setTimeout(() => { canClick = true; btnAnimaciones.classList.remove('boton-deshabilitado'); }, 1000);
        });
    </script>
</body>

</html>
