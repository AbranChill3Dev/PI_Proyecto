<!DOCTYPE html>
<html>

<head>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

        <link rel="stylesheet" href="/CSS/default.css">
        <link rel="stylesheet" href="/CSS/camara.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <title>FifaScan</title>
    </head>
</head>

<body>

    <a-scene mindar-image="imageTargetSrc: /Modelos/targets(2).mind; uiScanning: #none;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="sudafrica" src="/Modelos/Sudafrica.glb"></a-asset-item>
            <a-asset-item id="tunez" src="/Modelos/Tunez.glb"></a-asset-item>
            <a-asset-item id="japon" src="/Modelos/Japon.glb"></a-asset-item>
            <a-asset-item id="uruguay" src="/Modelos/Uruguay.glb"></a-asset-item>
            <a-asset-item id="espana" src="/Modelos/Espana.glb"></a-asset-item>
            <a-asset-item id="corea" src="/Modelos/Corea.glb"></a-asset-item>
            <a-asset-item id="mexico" src="/Modelos/Mexico.glb"></a-asset-item>
            <a-asset-item id="colombia" src="/Modelos/Colombia.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" data-country="sudafrica">
            <a-gltf-model src="#sudafrica" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1" data-country="tunez">
            <a-gltf-model src="#tunez" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2" data-country="japon">
            <a-gltf-model src="#japon" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3" data-country="uruguay">
            <a-gltf-model src="#uruguay" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 4" data-country="espana">
            <a-gltf-model src="#espana" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 5" data-country="corea">
            <a-gltf-model src="#corea" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 6" data-country="mexico">
            <a-gltf-model src="#mexico" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 7" data-country="colombia">
            <a-gltf-model src="#colombia" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

    </a-scene>

    <div class="controles-camara">
        <a href="../index.html" class="boton-flotante">
            <i class="fas fa-arrow-left"></i>
            <span>VOLVER</span>
        </a>
        <a id="btn-estadisticas" href="#" class="boton-flotante boton-oculto">
            <i class="fas fa-chart-bar"></i>
            <span>ESTADISTICAS</span>
        </a>
        <button id="btn-animaciones" class="boton-flotante boton-oculto">
            <i class="fas fa-wand-magic-sparkles"></i>
            <span>ANIMACIONES</span>
        </button>
    </div>

    <canvas id="fireworks-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none;"></canvas>
    <script>
        // Mapeo de países a índices en estadísticas.js
        const paisMap = {
            'mexico': 0,
            'espana': 1,
            'uruguay': 2,
            'colombia': 3,
            'japon': 4,
            'corea': 5,
            'sudafrica': 6,
            'tunez': 7
        };

        const btnEstadisticas = document.getElementById('btn-estadisticas');
        const btnAnimaciones = document.getElementById('btn-animaciones');
        const fireworksCanvas = document.getElementById('fireworks-canvas');
        const ctx = fireworksCanvas.getContext('2d');
        let targetActual = null;
        let particles = [];
        let currentAnim = 0; // 0 = explosion, 1 = fireworks
        let showText = false;
        let textOpacity = 0;

        // Configurar canvas
        function resizeCanvas() {
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Obtener todas las entidades con mindar-image-target
        const targets = document.querySelectorAll('[mindar-image-target]');

        targets.forEach(target => {
            // Detectar cuando el target aparece
            target.addEventListener('targetFound', () => {
                const country = target.getAttribute('data-country');
                targetActual = country;
                const indice = paisMap[country];
                
                // Mostrar botones y establecer href
                btnEstadisticas.href = `estadisticas.html?pais=${indice}`;
                btnEstadisticas.classList.remove('boton-oculto');
                btnAnimaciones.classList.remove('boton-oculto');
            });

            // Detectar cuando el target desaparece
            target.addEventListener('targetLost', () => {
                targetActual = null;
                // Ocultar botones
                btnEstadisticas.classList.add('boton-oculto');
                btnAnimaciones.classList.add('boton-oculto');
            });
        });

        // Clase base de partículas
        class Particle {
            constructor(x, y, color, size, speed) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.opacity = 1;
                this.speedX = (Math.random() - 0.5) * speed;
                this.speedY = (Math.random() - 0.5) * speed - 1;
                this.decay = Math.random() * 0.015 + 0.008;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.15; // gravedad
                this.opacity -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Clase para partículas de fuego con gradiente
        class FireParticle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'core', 'spark', 'smoke'
                this.opacity = 1;
                
                if (type === 'core') {
                    this.size = Math.random() * 20 + 15;
                    this.speedX = (Math.random() - 0.5) * 8;
                    this.speedY = (Math.random() - 0.5) * 8 - 1;
                    this.decay = Math.random() * 0.03 + 0.02;
                } else if (type === 'spark') {
                    this.size = Math.random() * 8 + 4;
                    this.speedX = (Math.random() - 0.5) * 16;
                    this.speedY = (Math.random() - 0.5) * 16 - 2;
                    this.decay = Math.random() * 0.025 + 0.012;
                } else { // smoke
                    this.size = Math.random() * 30 + 20;
                    this.speedX = (Math.random() - 0.5) * 4;
                    this.speedY = -Math.random() * 3 - 1;
                    this.decay = Math.random() * 0.008 + 0.003;
                }
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.type !== 'smoke') {
                    this.speedY += 0.15;
                }
                this.opacity -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                
                if (this.type === 'core') {
                    // Núcleo amarillo-naranja
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                    gradient.addColorStop(0, 'rgba(255, 255, 100, 0.8)');
                    gradient.addColorStop(0.5, 'rgba(255, 180, 0, 0.6)');
                    gradient.addColorStop(1, 'rgba(255, 80, 0, 0)');
                    ctx.fillStyle = gradient;
                } else if (this.type === 'spark') {
                    // Chispas rojas
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                    gradient.addColorStop(0, 'rgba(255, 100, 0, 1)');
                    gradient.addColorStop(1, 'rgba(200, 0, 0, 0)');
                    ctx.fillStyle = gradient;
                } else {
                    // Humo gris
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                    gradient.addColorStop(0, 'rgba(100, 100, 100, 0.3)');
                    gradient.addColorStop(1, 'rgba(50, 50, 50, 0)');
                    ctx.fillStyle = gradient;
                }
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Fuegos rojos y blancos (explosión clásica)
        // función para crear fuegos artificiales usando la clase Particle
        function createRealFireworks(x, y) {
            const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500'];
            for (let i = 0; i < 100; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const p = new Particle(x, y, color, Math.random() * 8 + 4, 30);
                // darle un impulso mayor en y para simular estallido
                p.speedY -= Math.random() * 10 + 5;
                particles.push(p);
            }
        }

        // Explosión grande de centro con efecto realista de fuego
        function createBigExplosion(x, y) {
            // Núcleo central amarillo-naranja
            for (let i = 0; i < 40; i++) {
                particles.push(new FireParticle(x, y, 'core'));
            }
            
            // Chispas rojas que salen disparadas
            for (let i = 0; i < 80; i++) {
                particles.push(new FireParticle(x, y, 'spark'));
            }
            
            // Humo que sube
            for (let i = 0; i < 30; i++) {
                particles.push(new FireParticle(x, y, 'smoke'));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.opacity <= 0) {
                    particles.splice(i, 1);
                }
            }

            // dibujar texto encima si se debe mostrar
            if (showText) {
                ctx.save();
                ctx.globalAlpha = textOpacity;
                ctx.fillStyle = 'yellow';
                ctx.font = 'bold 120px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GOOOL', fireworksCanvas.width / 2, fireworksCanvas.height / 2);
                ctx.restore();

                // disminuir opacidad
                textOpacity -= 0.01;
                if (textOpacity <= 0) {
                    showText = false;
                    textOpacity = 0;
                }
            }

            if (particles.length > 0 || showText) {
                requestAnimationFrame(animateFireworks);
            } else {
                fireworksCanvas.style.display = 'none';
            }
        }

        // Evento del botón animaciones
        btnAnimaciones.addEventListener('click', (e) => {
            e.preventDefault();
            // limpiar cualquier animación anterior
            particles = [];
            showText = false;
            textOpacity = 0;

            fireworksCanvas.style.display = 'block';

            if (currentAnim === 0) {
                // animación de explosión realista con texto
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                showText = true;
                textOpacity = 1;
                createBigExplosion(centerX, centerY);
                // repetir un par de veces para efecto prolongado
                setTimeout(() => createBigExplosion(centerX, centerY), 250);
                setTimeout(() => createBigExplosion(centerX, centerY), 500);
            } else {
                // animación de fuegos artificiales realistas
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        const x = Math.random() * window.innerWidth;
                        const y = Math.random() * window.innerHeight / 2;
                        createRealFireworks(x, y);
                    }, i * 200);
                }
            }

            currentAnim = (currentAnim + 1) % 2;
            animateFireworks();
        });
    </script>
</body>

</html>
