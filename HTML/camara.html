<!DOCTYPE html>
<html>

<head>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

        <link rel="stylesheet" href="../CSS/default.css">
        <link rel="stylesheet" href="../CSS/camara.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <title>FifaScan</title>
    </head>
</head>

<body>

    <a-scene mindar-image="imageTargetSrc: ../Modelos/targets(2).mind; uiScanning: #none;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="sudafrica" src="../Modelos/Sudafrica.glb"></a-asset-item>
            <a-asset-item id="tunez" src="../Modelos/Tunez.glb"></a-asset-item>
            <a-asset-item id="japon" src="../Modelos/Japon.glb"></a-asset-item>
            <a-asset-item id="uruguay" src="../Modelos/Uruguay.glb"></a-asset-item>
            <a-asset-item id="espana" src="../Modelos/Espana.glb"></a-asset-item>
            <a-asset-item id="corea" src="../Modelos/Corea.glb"></a-asset-item>
            <a-asset-item id="mexico" src="../Modelos/Mexico.glb"></a-asset-item>
            <a-asset-item id="colombia" src="../Modelos/Colombia.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" data-country="sudafrica">
            <a-gltf-model src="#sudafrica" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1" data-country="tunez">
            <a-gltf-model src="#tunez" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2" data-country="japon">
            <a-gltf-model src="#japon" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3" data-country="uruguay">
            <a-gltf-model src="#uruguay" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 4" data-country="espana">
            <a-gltf-model src="#espana" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 5" data-country="corea">
            <a-gltf-model src="#corea" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 6" data-country="mexico">
            <a-gltf-model src="#mexico" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 7" data-country="colombia">
            <a-gltf-model src="#colombia" rotation="0 0 0" position="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
            </a-gltf-model>
        </a-entity>

    </a-scene>

    <div class="controles-camara">
        <a href="index.html" class="boton-flotante">
            <i class="fas fa-arrow-left"></i>
            <span>VOLVER</span>
        </a>
        <a id="btn-estadisticas" href="#" class="boton-flotante boton-oculto">
            <i class="fas fa-chart-bar"></i>
            <span>ESTADISTICAS</span>
        </a>
    </div>
    <script>
        // Mapeo de países a índices en estadísticas.js
        const paisMap = {
            'mexico': 0,
            'espana': 1,
            'uruguay': 2,
            'colombia': 3,
            'japon': 4,
            'corea': 5,
            'sudafrica': 6,
            'tunez': 7
        };

        const btnEstadisticas = document.getElementById('btn-estadisticas');
        let targetActual = null;

        // Obtener todas las entidades con mindar-image-target
        const targets = document.querySelectorAll('[mindar-image-target]');

        targets.forEach(target => {
            // Detectar cuando el target aparece
            target.addEventListener('targetFound', () => {
                const country = target.getAttribute('data-country');
                targetActual = country;
                const indice = paisMap[country];
                
                // Mostrar botón y establecer href
                btnEstadisticas.href = `estadisticas.html?pais=${indice}`;
                btnEstadisticas.classList.remove('boton-oculto');
            });

            // Detectar cuando el target desaparece
            target.addEventListener('targetLost', () => {
                targetActual = null;
                // Ocultar botón
                btnEstadisticas.classList.add('boton-oculto');
            });
        });
    </script>
</body>

</html>
